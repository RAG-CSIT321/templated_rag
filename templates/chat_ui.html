
<!DOCTYPE html>
<html>
<head>
    <link rel="icon" href="data:,">
    <title>Chatbot and File Upload</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        .message {
            margin-bottom: 10px;
        }
        .user {
            color: blue;
            font-weight: bold;
        }
        .assistant {
            color: green;
            font-weight: bold;
        }
        #chatbox {
            border: 1px solid #ccc;
            padding: 10px;
            height: 400px;
            overflow-y: scroll;
            background-color: #FFFFFF;
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #EFEFEF;
        }
        button {
            padding: 10px;
            margin-top: 10px;
            background-color: #483D8B;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .upload-section,
        .history-section {
            margin-top: 20px;
        }
        .upload-section input[type="file"] {
            margin-bottom: 10px;
        }
        #status {
            font-size: 13px;
            color: #000000;
            margin-top: 10px;
        }
        .history-section {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            background-color: #f9f9f9;
        }
        .history-item {
            margin: 5px 0;
        }
        #history-list {
            margin-top: 20px;
            border: 1px solid #ccc;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Chatbot</h1>
    <div id="chatbox"></div>
    <input id="prompt" type="text" placeholder="Type your message...">
    <button onclick="sendMessage()">Send</button>
    <button onclick="createNewSession()">New Chat</button>

    <div class="history-section">
        <h2>Chat History</h2>
        <button onclick="listChatHistory()">Load History Sessions</button>
        <div id="history-list"></div>
    </div>

    <div class="upload-section">
        <h2>Upload a File for Processing</h2>
        <input id="file-input" type="file" accept=".txt,.pdf,.csv,.png,.jpg,.jpeg">
        <button onclick="uploadFile()">Upload</button>
        <p id="status"></p>
    </div>

    <script>
        let currentSessionId = null
        const currentUserId = "demo_user_123"; 
        const chatbox = document.getElementById('chatbox');
        const promptInput = document.getElementById('prompt');
        const fileInput = document.getElementById('file-input');
        const statusText = document.getElementById('status');
        const historyList = document.getElementById('history-list');

        async function initializeFirstSession() {
            try {
                const response = await fetch('http://localhost:5000/api/create_new_session/' + currentUserId, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        session_name: "New Chat"
                    })
                });
                
                const data = await response.json();
                currentSessionId = data.session_id;
                listChatHistory(); // Refresh session list
            } catch (error) {
                console.error("Session creation error:", error);
                appendMessage('system', `Failed to start chat: ${error.message}`);
            }
        }

        async function createNewSession() {
            try {
                const response = await fetch('http://localhost:5000/api/create_new_session/' + currentUserId, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        session_name: "New Chat"
                    })
                });
                
                const data = await response.json();
                currentSessionId = data.session_id;
                chatbox.innerHTML = '';
                //appendMessage('system', 'New chat started');
                
                // Refresh the session list
                listChatHistory();
            } catch (error) {
                console.error("Error creating new session:", error);
                //appendMessage('system', `Failed to create new session: ${error.message}`);
            }
        }

        function appendMessage(role, content) {
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `<span class="${role}">${role}:</span> ${content}`;
            chatbox.appendChild(div);
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        async function sendMessage() {
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            appendMessage('user', prompt);
            promptInput.value = '';

            try {
                // Save user message immediately
                await fetch('http://localhost:5000/api/save_message', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: currentUserId,
                        session_id: currentSessionId,
                        role: 'user',
                        content: prompt
                    })
                });

                const response = await fetch('http://localhost:5000/api/interact_with_agent', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        prompt, 
                        session_id: currentSessionId,
                        user_id: currentUserId  
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const data = await response.json();
                if (data.messages && data.messages.length > 0) {
                    const assistantMessage = data.messages[0].content;
                    appendMessage('assistant', assistantMessage);
                    
                    // Save assistant response
                    await fetch('http://localhost:5000/api/save_message', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            user_id: currentUserId,
                            session_id: currentSessionId,
                            role: 'assistant',
                            content: assistantMessage
                        })
                    });
                } else {
                    throw new Error('Invalid response format');
                }
            } catch (error) {
                console.error('Error:', error);
                //appendMessage('system', `Error: ${error.message}`);
            }
        }


        async function saveMessageToHistory(role, content) {
            try {
                await fetch('http://localhost:5000/api/save_message', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: currentUserId,
                        session_id: currentSessionId,
                        role: role,
                        content: content
                    })
                });
            } catch (error) {
                console.error('Error saving message:', error);
            }
        }



        async function listChatHistory() {
            try {
                const response = await fetch(`http://localhost:5000/api/list_chat_sessions/${currentUserId}`);
                
                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}`);
                }

                const result = await response.json();
                console.log("API Response:", result);  // Debug log
                
                // Handle the response data
                const sessions = result.data || [];
                historyList.innerHTML = '';

                if (sessions.length === 0) {
                    historyList.innerHTML = '<p>No chat sessions found</p>';
                    return;
                }

                sessions.forEach(session => {
                    const sessionDiv = document.createElement('div');
                    sessionDiv.className = 'session-item';
                    
                    sessionDiv.innerHTML = `
                        <div class="session-header">
                            <span class="session-name">${session.session_name || 'Unnamed Session'}</span>
                            <span class="session-time">${session.last_updated}</span>
                        </div>
                        <div class="session-actions">
                            <button onclick="loadChatHistory('${session.session_id}')">Load</button>
                            <button onclick="deleteSession('${session.session_id}')">Delete</button>
                        </div>
                    `;
                    
                    historyList.appendChild(sessionDiv);
                });

            } catch (error) {
                console.error("Error loading sessions:", error);
                historyList.innerHTML = `
                    <p class="error">Failed to load sessions</p>
                    <p>${error.message}</p>
                `;
            }
        }

        async function loadChatHistory(sessionId) {
            try {
                currentSessionId = sessionId;
                const response = await fetch(
                    `http://localhost:5000/api/load_chat_history/${currentUserId}/${sessionId}`
                );
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                console.log("Chat history loaded:", result);
                
                chatbox.innerHTML = '';
                
                if (result.messages && result.messages.length > 0) {
                    result.messages.forEach(msg => {
                        if (msg.content && msg.content.trim() !== '') {
                            appendMessage(msg.role, msg.content);
                        }
                    });
                } else {
                    appendMessage('system', 'No messages in this session yet');
                }
            } catch (error) {
                console.error("Load error:", error);
                appendMessage('system', `Failed to load chat: ${error.message}`);
            }
        }

        initializeFirstSession();

        async function deleteSession(sessionId) {
            if (!confirm("Are you sure you want to delete this session?")) return;
            
            try {
                const response = await fetch(
                    `http://localhost:5000/api/delete_session/${currentUserId}/${sessionId}`,
                    { method: 'DELETE' }
                );
                
                if (!response.ok) {
                    throw new Error(`Delete failed: ${response.status}`);
                }
                
                // Refresh the list
                listChatHistory();
                chatbox.innerHTML = '';
                appendMessage('system', 'Session deleted successfully');
                
            } catch (error) {
                console.error("Delete error:", error);
                appendMessage('system', `Failed to delete session: ${error.message}`);
            }
        }

        async function uploadFile() {
            const file = fileInput.files[0];
            if (!file) {
                statusText.textContent = 'No file selected';
                return;
            }
            const formData = new FormData();
            formData.append('file', file);

            const response = await fetch('http://localhost:5000/api/upload_file', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            statusText.textContent = data.message || 'File processed successfully!';
        }

        promptInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });

        listChatHistory();
    </script>
</body>
</html>
