<!DOCTYPE html>
<html>
<head>
    <link rel="icon" href="data:,">
    <title>Chatbot and File Upload</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        .message {
            margin-bottom: 10px;
        }
        .user {
            color: blue;
            font-weight: bold;
        }
        .assistant {
            color: green;
            font-weight: bold;
        }
        #chatbox {
            border: 1px solid #ccc;
            padding: 10px;
            height: 400px;
            overflow-y: scroll;
            background-color: #FFFFFF;
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #EFEFEF;
        }
        button {
            padding: 10px;
            margin-top: 10px;
            background-color: #483D8B;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .upload-section,
        .history-section {
            margin-top: 20px;
        }
        .upload-section input[type="file"] {
            margin-bottom: 10px;
        }
        #status {
            font-size: 13px;
            color: #000000;
            margin-top: 10px;
        }
        .history-section {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            background-color: #f9f9f9;
        }
        .history-item {
            margin: 5px 0;
        }
        #history-list {
            margin-top: 20px;
            border: 1px solid #ccc;
            padding: 10px;
        }

        /*Auth Section*/
        #auth-section {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 5px;
        }
        #auth-section-input {
            display: block;
            margin: 10px 0;
            padding: 8px;
            width: 200px;
        }
        #auth-section button {
            margin-right: 10px;
            padding: 8px 15px;
        }
        #user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        #username-display {
            font-weight: bold;
        }
        .auth-error {
            color: red;
            margin-top: 10px;
        }

        .upload-history-section {
            margin-top: 20px;
            border: 1px solid #ccc;
            padding: 10px;
            background-color: #f9f9f9;
            max-height: 200px;
            overflow-y: auto;
        }
        .upload-history-item {
            margin: 5px 0;
        }

    </style>
</head>
<body>
    <div id="auth-section">
        <div id="login-form" style="display: none;">
            <h2>Login</h2>
            <input id="login-username" type="text" placeholder="Username">
            <input id="login-password" type="password" placeholder="Password">
            <button onclick="login()">Login</button>
            <button onclick="showSignup()">Sign Up</button>
            <div id="login-error" class="auth-error"></div>
        </div>
        
        <div id="signup-form" style="display: none;">
            <h2>Sign Up</h2>
            <input id="signup-username" type="text" placeholder="Username">
            <input id="signup-email" type="email" placeholder="Email (optional)">
            <input id="signup-password" type="password" placeholder="Password">
            <button onclick="signup()">Create Account</button>
            <button onclick="showLogin()">Back to Login</button>
            <div id="signup-error" class="auth-error"></div>
        </div>
        
        <div id="user-info" style="display: none;">
            <span id="username-display"></span>
            <button onclick="logout()">Logout</button>
        </div>
    </div>
    
    <h1>Chatbot</h1>
    <div id="chatbox"></div>
    <input id="prompt" type="text" placeholder="Type your message...">
    <button onclick="sendMessage()">Send</button>
    <button onclick="createNewSession()">New Chat</button>

    <div class="history-section">
        <h2>Chat History</h2>
        <button onclick="listChatHistory()">Load History Sessions</button>
        <div id="history-list"></div>
    </div>

    <div class="upload-section">
        <h2>Upload a File for Processing</h2>
        <input id="file-input" type="file" accept=".txt,.pdf,.csv,.png,.jpg,.jpeg">
        <button onclick="uploadFile()">Upload</button>
        <p id="status"></p>
    </div>


    <script>
        // Authentication state
        let currentToken = null;
        let currentUserId = null;
        let currentUsername = null;
        let currentSessionId = null;

        //DOM elements
        const chatbox = document.getElementById('chatbox');
        const promptInput = document.getElementById('prompt');
        const fileInput = document.getElementById('file-input');
        const statusText = document.getElementById('status');
        const historyList = document.getElementById('history-list');
        
        // Auth DOM Elements
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const userInfo = document.getElementById('user-info');
        const usernameDisplay = document.getElementById('username-display');
        const loginError = document.getElementById('login-error');
        const signupError = document.getElementById('signup-error');
        const uploadedFileHistoryList = document.getElementById('uploaded-file-history-list');

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            checkAuthStatus();
            
            // Set up enter key for prompt
            promptInput.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    sendMessage();
                }
            });
        });

        // Auth Functions
        function showLogin() {
            loginForm.style.display = 'block';
            signupForm.style.display = 'none';
            userInfo.style.display = 'none';
            loginError.textContent = '';
        }

        function showSignup() {
            loginForm.style.display = 'none';
            signupForm.style.display = 'block';
            userInfo.style.display = 'none';
            signupError.textContent = '';
        }

        function showUserInfo() {
            loginForm.style.display = 'none';
            signupForm.style.display = 'none';
            userInfo.style.display = 'block';
            usernameDisplay.textContent = currentUsername;
        }

        async function checkAuthStatus() {
            const token = localStorage.getItem('auth_token');
            if (token) {
                try {
                    // First try with current token
                    let response = await fetch('http://localhost:5000/api/me', {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    if (response.status === 401) {
                        // Try to refresh token
                        const refreshSuccess = await attemptTokenRefresh();
                        if (refreshSuccess) {
                            // Retry with new token
                            response = await fetch('http://localhost:5000/api/me', {
                                headers: {
                                    'Authorization': `Bearer ${currentToken}`
                                }
                            });
                        }
                    }
                    
                    if (response.ok) {
                        const user = await response.json();
                        currentToken = token;
                        currentUserId = user.user_id;
                        currentUsername = user.username;
                        showUserInfo();
                        
                        // Load chat history and upload history
                        listChatHistory();
                        listUploadedFileHistory();
                        return;
                    }
                } catch (error) {
                    console.error("Auth check failed:", error);
                }
            }
            showLogin();
        }

        async function login() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            
            if (!username || !password) {
                document.getElementById('login-error').textContent = 'Please enter both username and password';
                return;
            }
            
            try {
                const requestBody = {
                    username: username,
                    password: password
                };
                
                console.log('Sending login request:', requestBody);
                
                const response = await fetch('http://localhost:5000/api/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });
                
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ detail: 'Unknown error occurred' }));
                    console.error('Login error response:', errorData);
                    const errorMessage = errorData.detail || 'Login failed';
                    if (response.status === 401) {
                        document.getElementById('login-error').textContent = 'Incorrect username or password';
                    } else {
                        document.getElementById('login-error').textContent = errorMessage;
                    }
                    return;
                }
                
                const data = await response.json();
                console.log('Login successful:', data);
                
                currentToken = data.access_token;
                currentUserId = data.user_id;
                currentUsername = username;
                
                localStorage.setItem('auth_token', currentToken);
                showUserInfo();
                
                // Clear chat and history
                chatbox.innerHTML = '';
                historyList.innerHTML = '';
                
                // Load chat history and upload history
                listChatHistory();
                listUploadedFileHistory();
            } catch (error) {
                console.error('Login error:', error);
                document.getElementById('login-error').textContent = error.message;
            }
        }

        async function signup() {
            const username = document.getElementById('signup-username').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            
            if (!username || !password) {
                signupError.textContent = 'Username and password are required';
                return;
            }
            
            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);
            if (email) formData.append('email', email);
                const response = await fetch('http://localhost:5000/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        email: email || null,
                        password: password
                    })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Signup failed');
                }
                
                // After successful signup, show login form
                showLogin();
                document.getElementById('login-username').value = username;
                signupError.textContent = '';
                loginError.textContent = 'Account created! Please login.';
            } catch (error) {
                signupError.textContent = error.message;
                console.error("Signup error:", error);
            }
        }

        function logout() {
            currentToken = null;
            currentUserId = null;
            currentUsername = null;
            currentSessionId = null;
            localStorage.removeItem('auth_token');
            showLogin();
            chatbox.innerHTML = '';
            historyList.innerHTML = '';
        }
        
        // Chat Functions

        function appendMessage(role, content) {
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `<span class="${role}">${role}:</span> ${content}`;
            chatbox.appendChild(div);
            chatbox.scrollTop = chatbox.scrollHeight;
        }

/*
        async function createNewSession() {
            if (!currentUserId) {
                alert("Please login first");
                return;
            }
            
            try {
                const response = await fetch('http://localhost:5000/api/create_new_session/' + currentUserId, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${currentToken}`
                    },
                    body: JSON.stringify({
                        session_name: "New Chat"
                    })
                });
                
                const data = await response.json();
                currentSessionId = data.session_id;
                chatbox.innerHTML = '';
                listChatHistory();
            } catch (error) {
                console.error("Error creating new session:", error);
                appendMessage('system', `Failed to create new session: ${error.message}`);
            }
        }
*/
        async function createNewSession() {
            if (!currentUserId) {
                alert("Please login first");
                return;
            }
            
            // Clear the chat and reset session ID
            chatbox.innerHTML = '';
            currentSessionId = null;
            appendMessage('system', 'New chat started. Send a message to begin.');
            listChatHistory();
        }

        async function sendMessage() {
            if (!currentToken) {
                alert("Please login first");
                return;
            }
            
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            appendMessage('user', prompt);
            promptInput.value = '';
            
            // Add loading indicator
            const loadingId = 'loading-' + Date.now();
            appendMessage('system', '<div id="' + loadingId + '">Processing your request...</div>');

            try {
                // Prepare the request body
                const requestBody = {
                    user_id: currentUserId,
                    session_id: currentSessionId || null,  // Send null if no session ID
                    role: 'user',
                    content: prompt
                };

                console.log("Sending message:", requestBody);  // Debug log

                let saveResponse = await fetch('http://localhost:5000/api/save_message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${currentToken}`
                    },
                    body: JSON.stringify(requestBody)
                });
                if (saveResponse.status === 401) {
                    await attemptTokenRefresh();
                    saveResponse = await fetch('http://localhost:5000/api/save_message', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${currentToken}`
                        },
                        body: JSON.stringify({
                            user_id: currentUserId,
                            session_id: currentSessionId,
                            role: 'user',
                            content: prompt
                        })
                    });
                }

                if (!saveResponse.ok) {
                    throw new Error(`Failed to save message: ${saveResponse.status}`);
                }

                const saveData = await saveResponse.json();
                currentSessionId = saveData.session_id;

                // Get AI response
                let response = await fetch('http://localhost:5000/api/interact_with_agent', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${currentToken}`
                    },
                    body: JSON.stringify({
                        prompt, 
                        session_id: currentSessionId,
                        user_id: currentUserId  
                    })
                });

                if (response.status === 401) {
                    await attemptTokenRefresh();
                    // Retry with new token
                    response = await fetch('http://localhost:5000/api/interact_with_agent', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${currentToken}`
                        },
                        body: JSON.stringify({
                            prompt, 
                            session_id: currentSessionId,
                            user_id: currentUserId  
                        })
                    });
                }

                // Remove loading message
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement && loadingElement.parentNode) {
                    loadingElement.parentNode.remove();
                }

                // Handle response
                const data = await response.json();
                if (data.messages && data.messages.length > 0) {
                    const assistantMessage = data.messages[0].content;
                    appendMessage('assistant', assistantMessage);
                    
                    // Save assistant response
                    await fetch('http://localhost:5000/api/save_message', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${currentToken}`
                        },
                        body: JSON.stringify({
                            user_id: currentUserId,
                            session_id: currentSessionId,
                            role: 'assistant',
                            content: assistantMessage
                        })
                    });
                } else {
                    throw new Error('Invalid response format');
                }
            } catch (error) {
                console.error('Error:', error);
                
                // Remove loading message if it exists
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement && loadingElement.parentNode) {
                    loadingElement.parentNode.remove();
                }
                
                appendMessage('system', `Error: ${error.message}`);
                if (error.message.includes('401')) {
                    alert("Session expired. Please login again.");
                    logout();
                }
            }
        }

        async function attemptTokenRefresh() {
            try {
                const refreshResponse = await fetch('http://localhost:5000/api/refresh_token', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`
                    }
                });

                if (refreshResponse.ok) {
                    const refreshData = await refreshResponse.json();
                    currentToken = refreshData.access_token;
                    localStorage.setItem('auth_token', currentToken);
                    return true;
                } else {
                    throw new Error('Token refresh failed');
                }
            } catch (error) {
                console.error('Token refresh error:', error);
                throw error;
            }
        }

        async function listChatHistory() {
            if (!currentUserId) return;
            
            try {
                const response = await fetch(`http://localhost:5000/api/list_chat_sessions/${currentUserId}`, {
                    headers: {
                        'Authorization': `Bearer ${currentToken}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}`);
                }

                const result = await response.json();
                const sessions = result.data || [];
                historyList.innerHTML = '';

                if (sessions.length === 0) {
                    historyList.innerHTML = '<p>No chat sessions found</p>';
                    return;
                }

                sessions.forEach(session => {
                    const sessionDiv = document.createElement('div');
                    sessionDiv.className = 'session-item';
                    
                    sessionDiv.innerHTML = `
                        <div class="session-header">
                            <span class="session-name">${session.session_name || 'Unnamed Session'}</span>
                            <span class="session-time">${session.last_updated}</span>
                        </div>
                        <div class="session-actions">
                            <button onclick="loadChatHistory('${session.session_id}')">Load</button>
                            <button onclick="deleteSession('${session.session_id}')">Delete</button>
                        </div>
                    `;
                    
                    historyList.appendChild(sessionDiv);
                });

            } catch (error) {
                console.error("Error loading sessions:", error);
                historyList.innerHTML = `
                    <p class="error">Failed to load sessions</p>
                    <p>${error.message}</p>
                `;
            }
        }

        async function loadChatHistory(sessionId) {
            if (!currentUserId) return;
            
            try {
                currentSessionId = sessionId;
                const response = await fetch(
                    `http://localhost:5000/api/load_chat_history/${currentUserId}/${sessionId}`, {
                        headers: {
                            'Authorization': `Bearer ${currentToken}`
                        }
                    });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                console.log("Chat history loaded:", result);
                
                chatbox.innerHTML = '';
                
                if (result.messages && result.messages.length > 0) {
                    result.messages.forEach(msg => {
                        if (msg.content && msg.content.trim() !== '') {
                            appendMessage(msg.role, msg.content);
                        }
                    });
                } else {
                    appendMessage('system', 'No messages in this session yet');
                }
            } catch (error) {
                console.error("Load error:", error);
                appendMessage('system', `Failed to load chat: ${error.message}`);
            }
        }

        async function deleteSession(sessionId) {
            if (!confirm("Are you sure you want to delete this session?")) return;
            
            try {
                const response = await fetch(
                    `http://localhost:5000/api/delete_session/${currentUserId}/${sessionId}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${currentToken}`
                        }
                    });
                
                if (!response.ok) {
                    throw new Error(`Delete failed: ${response.status}`);
                }
                
                // Refresh the list
                await listChatHistory();
                chatbox.innerHTML = '';
                appendMessage('system', 'Session deleted successfully');

                // Check if there are no sessions left
                if (historyList.innerHTML.includes('No chat sessions found')) {
                    await createNewSession();
                }
                
            } catch (error) {
                console.error("Delete error:", error);
                appendMessage('system', `Failed to delete session: ${error.message}`);
            }
        }

        async function uploadFile() {
            if (!currentToken) {
                alert("Please login first");
                return;
            }
            
            const file = fileInput.files[0];
            if (!file) {
                statusText.textContent = 'No file selected';
                return;
            }
            statusText.textContent = 'Uploading file...';
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('http://localhost:5000/api/upload_file', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`
                    },
                    body: formData
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Upload failed: ${response.status} - ${errorText}`);
                }
                
                const data = await response.json();
                statusText.textContent = data.message || 'File processed successfully!';
                
                // Clear the file input
                fileInput.value = '';
                
                // Refresh the uploaded files list
                await listUploadedFileHistory();
                
            } catch (error) {
                statusText.textContent = `File upload failed: ${error.message}`;
                console.error('Upload error:', error);
            }
        }

    </script>
</body>
</html>
