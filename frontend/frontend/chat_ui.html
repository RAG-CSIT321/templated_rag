
<!DOCTYPE html>
<html>
<head>
    <title>Chatbot and File Upload</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        .message {
            margin-bottom: 10px;
        }
        .user {
            color: blue;
            font-weight: bold;
        }
        .assistant {
            color: green;
            font-weight: bold;
        }
        #chatbox {
            border: 1px solid #ccc;
            padding: 10px;
            height: 400px;
            overflow-y: scroll;
            background-color: #FFFFFF;
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #EFEFEF;
        }
        button {
            padding: 10px;
            margin-top: 10px;
            background-color: #483D8B;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .upload-section,
        .history-section {
            margin-top: 20px;
        }
        .upload-section input[type="file"] {
            margin-bottom: 10px;
        }
        #status {
            font-size: 13px;
            color: #000000;
            margin-top: 10px;
        }
        .history-section {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            background-color: #f9f9f9;
        }
        .history-item {
            margin: 5px 0;
        }
        #history-list {
            margin-top: 20px;
            border: 1px solid #ccc;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Chatbot</h1>
    <div id="chatbox"></div>
    <input id="prompt" type="text" placeholder="Type your message...">
    <button onclick="sendMessage()">Send</button>

    <div class="history-section">
        <h2>Chat History</h2>
        <button onclick="listChatHistory()">Load History Sessions</button>
        <div id="history-list"></div>
    </div>

    <div class="upload-section">
        <h2>Upload a File for Processing</h2>
        <input id="file-input" type="file" accept=".txt,.pdf,.csv,.png,.jpg,.jpeg">
        <button onclick="uploadFile()">Upload</button>
        <p id="status"></p>
    </div>

    <script>
        const chatbox = document.getElementById('chatbox');
        const promptInput = document.getElementById('prompt');
        const fileInput = document.getElementById('file-input');
        const statusText = document.getElementById('status');
        const historyList = document.getElementById('history-list');

        function appendMessage(role, content) {
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `<span class="${role}">${role}:</span> ${content}`;
            chatbox.appendChild(div);
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        async function sendMessage() {
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            appendMessage('user', prompt);
            promptInput.value = '';

            try {
                const response = await fetch('http://localhost:5000/api/interact_with_agent', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({prompt, session_id: 'default'})
                });

                if (!response.ok) {
                    console.error('HTTP error:', response.status);
                    alert('Server error: ' + response.statusText);
                    return;
                }

                const data = await response.json();
                if (data.messages) {
                    data.messages.forEach(msg => appendMessage(msg.role, msg.content));
                } else {
                    console.error('Invalid response format:', data);
                    alert('Error receiving response from server.');
                }
            } catch (error) {
                console.error('Network error:', error);
                alert('Failed to connect to server.');
            }
        }


        async function listChatHistory() {
            const response = await fetch('http://localhost:5000/api/list_chat_sessions');
            const sessions = await response.json();
            historyList.innerHTML = '';
            if (sessions.length === 0) {
                historyList.innerHTML = '<p>No chat history available.</p>';
                return;
            }
            sessions.forEach(session => {
                const btn = document.createElement('button');
                btn.textContent = `Session: ${session[0]} (Last updated: ${session[1]})`;
                btn.onclick = () => loadChatHistory(session[0]);
                historyList.appendChild(btn);
            });
        }

        async function loadChatHistory(sessionId) {
            const response = await fetch(`http://localhost:5000/api/load_chat_history/${sessionId}`);
            const history = await response.json();
            if (history.messages) {
                chatbox.innerHTML = '';
                history.messages.forEach(msg => appendMessage(msg.role, msg.content));
            } else {
                alert('No chat history found.');
            }
        }

        async function uploadFile() {
            const file = fileInput.files[0];
            if (!file) {
                statusText.textContent = 'No file selected';
                return;
            }
            const formData = new FormData();
            formData.append('file', file);

            const response = await fetch('http://localhost:5000/api/upload_file', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            statusText.textContent = data.message || 'File processed successfully!';
        }

        promptInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });

        listChatHistory();
    </script>
</body>
</html>
